<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会員ログインの接続確認 | 結友亭</title><link rel="stylesheet" href="style.css?v=20261127-line1"></head><body><main style="max-width:42rem;margin:2rem auto;padding:1rem"><h1>会員ログインの接続確認</h1><p>共通保存を使うため、Googleアカウントでログインしてください。この操作だけでは記録の追加・修正権限は付与されません。</p><p>現在の端末内データは、この画面では変更しません。</p><button id="login" disabled>Googleでログイン</button> <button id="logout" hidden>ログアウト</button><p id="status" role="status">準備しています…</p><p id="identity"></p><p><a href="./">公演管理に戻る</a></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';
const login=document.querySelector('#login'),logout=document.querySelector('#logout'),status=document.querySelector('#status'),identity=document.querySelector('#identity');
try {
 const config=await fetch('./cloud-config.json',{cache:'no-store'}).then(r=>r.json());
 const auth=getAuth(initializeApp(config.firebase));
 onAuthStateChanged(auth,user=>{
  login.hidden=!!user;login.disabled=false;logout.hidden=!user;
  status.textContent=user?'ログインできました。管理者による会員登録をお待ちください。':'Googleでログインしてください。';
  identity.textContent=user?`アカウント：${user.email} ／ 会員ID：${user.uid}`:'';
 });
 login.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent=`ログインできませんでした（${e.code||'通信エラー'}）。Chromeで開き直してお試しください。`}};
 logout.onclick=()=>signOut(auth);
} catch {status.textContent='接続できません。通信を確認して再読み込みしてください。'}
</script></body></html>
