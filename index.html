<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202c46">
<title>公演管理 | 結友亭落語研究会</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top"><div class="wrap top-inner"><a class="brand" href="./"><span class="crest" aria-hidden="true">結</span><span>結友亭落語研究会<small>公演管理</small></span></a><button id="data-open" class="data-button">⇅ <span>データ管理</span></button></div></header>
<main class="wrap">
  <section class="hero"><div class="hero-art" aria-hidden="true"><i></i><i></i><i></i></div><p class="hero-kicker">結友亭落語研究会</p><h1>公演管理</h1><p>公演の予定から、当日までの準備をひとまとめに。</p></section>
  <p><a class="secondary" href="history.html">稽古・公演記録を見る</a></p>
  <section class="stats" id="stats" aria-label="公演の集計"></section>
  <section class="workspace" aria-labelledby="schedule-title">
    <div class="section-head"><div><p class="eyebrow">SCHEDULE</p><h2 id="schedule-title">公演スケジュール</h2></div><button class="primary" id="new-event">＋ 公演を登録</button></div>
    <nav class="tabs" aria-label="表示形式"><button id="list-tab" aria-pressed="true">☷ 一覧</button><button id="calendar-tab" aria-pressed="false">稽古予定・出欠</button></nav>
    <div id="schedule"></div>
  </section>
</main>
<footer class="wrap">結友亭落語研究会 <span>公演管理</span></footer>
<dialog id="event-dialog" aria-labelledby="event-heading"></dialog>
<dialog id="data-dialog" aria-labelledby="data-heading">
  <div class="dialog-body"><div class="dialog-head"><h2 id="data-heading">データ管理</h2><button type="button" data-close="data-dialog" aria-label="閉じる">×</button></div>
  <p>共通保存が有効な場合は会員で共有します。設定準備中は、このブラウザに保存されます。JSONファイルでバックアップや別の端末への移行ができます。</p>
  <button class="primary" id="export-file">JSONを書き出す</button>
  <hr><label for="import-file">JSONファイルを取り込む</label><p class="muted">取り込んだ公演を追加します。同じIDの公演は取り込んだ内容に更新します。</p>
  <input type="file" id="import-file" accept=".json,application/json"><button class="secondary" id="import-submit">取り込む</button><p id="import-feedback" role="status"></p></div>
</dialog>
<div id="notice" role="status" class="notice" hidden></div>
</body>
</html>
