<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css?v=20261124-map1">
<script type="module" src="app.js?v=20261124-map1"></script>
<link rel="stylesheet" href="schedule-ui.css?v=20261124-map1"><link rel="stylesheet" href="rakugo-theme.css?v=20261124-map1"><link rel="manifest" href="manifest.webmanifest?v=20261124-map1"><link rel="icon" type="image/png" href="notebook-pixel-any-192-v3.png"><link rel="apple-touch-icon" href="notebook-pixel-maskable-512-v3.png"><meta name="theme-color" content="#071d42"><meta name="apple-mobile-web-app-capable" content="yes"><script src="install.js?v=20261124-map1" defer></script></head>
<body class="member-view">
<header class="top"><div class="wrap top-inner"><div class="header-actions"><button id="data-open" class="data-button">データ管理</button></div></div></header>
<main class="wrap">
  <section class="hero"><img class="hero-logo" src="notebook-art-v2.png" alt="" width="96" height="109"><div><p class="hero-kicker">笑いで友をむすび、落語で地域を結ぶ</p><h1>結友亭の帳面</h1><p>公演の支度も、日々の稽古も。</p></div></section><nav class="tabs" aria-label="画面の切り替え"><button id="list-tab" aria-pressed="true">公演一覧</button><button id="calendar-tab" aria-pressed="false">稽古出欠</button><a href="history.html?v=20261124-map1">稽古・公演記録</a></nav>
  
  
  <section id="next-performance" class="member-home" aria-label="次回の公演" hidden></section>
  <section class="workspace" aria-labelledby="schedule-title">
    <div class="section-head"><div><p class="eyebrow">SCHEDULE</p><h2 id="schedule-title">公演スケジュール</h2></div><button class="primary" id="new-event">＋ 公演を登録</button></div>
    
    <div id="schedule"></div>
  </section>
</main>
<footer class="wrap">結友亭落語研究会 <span>公演管理</span></footer>
<dialog id="event-dialog" aria-labelledby="event-heading"></dialog>
<dialog id="data-dialog" aria-labelledby="data-heading">
  <div class="dialog-body"><div class="dialog-head"><h2 id="data-heading">データ管理</h2><button type="button" data-close="data-dialog" aria-label="閉じる">×</button></div>
  <p>共通保存が有効な場合は会員で共有します。設定準備中は、このブラウザに保存されます。公演のJSONには表示中の公演と、この端末の記録・区分が入ります。共通の記録は記録一覧でCSV保存できます。</p>
  <button class="primary" id="export-file">JSONを書き出す</button>
  <hr><label for="import-file">JSONファイルを取り込む</label><p class="muted">取り込んだ公演を追加します。同じIDの公演は取り込んだ内容に更新します。</p>
  <input type="file" id="import-file" accept=".json,application/json"><button class="secondary" id="import-submit">取り込む</button><p id="import-feedback" role="status"></p></div>
</dialog>
<div id="notice" role="status" class="notice" hidden></div>
</body>
</html>
