<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理者｜結友亭の帳面</title><link rel="stylesheet" href="style.css?v=20261119-share1"><link rel="stylesheet" href="schedule-ui.css?v=20261119-share1"><link rel="stylesheet" href="rakugo-theme.css?v=20261119-share1"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="app-icon-192.png"><script src="install.js?v=20261119-share1" defer></script></head><body><header class="top"><div class="wrap top-inner"><a class="brand" href="./?v=20261119-share1"><img class="brand-logo" src="logo.jpg" alt="結友亭の紋"><span>結友亭落語研究会<small>稽古と公演の帳面</small></span></a><div class="header-actions"><button id="data-open" class="data-button">データ管理</button></div></div></header><main class="wrap"><h1>管理者ページ</h1><nav class="tabs"><a href="./?v=20261119-share1">公演一覧</a><a href="rehearsals.html?v=20261119-share1">稽古出欠</a><a href="history.html?v=20261119-share1">稽古・公演記録</a></nav><section id="admin-status" class="admin-panel" role="status">接続を確認しています。</section><div id="admin-tools" hidden><section class="admin-panel"><h2>終了した予定を記録へ移す</h2><p>日付が過ぎた予定を選択して移します。過去になっただけでは自動で移動しません。</p><button id="refresh-past">一覧を更新</button><div id="past-items"></div><button id="archive-selected" class="primary" disabled>選んだ予定を記録へ移す</button><p id="archive-result" role="status"></p></section><section class="admin-panel"><h2>会員・管理者の登録</h2><p>最初の管理者は勇水のみです。管理者の追加・変更は勇水が行います。</p><div id="member-list"></div><form id="member-form"><input type="hidden" name="id"><label>登録名<input name="name" required maxlength="40"></label><label>権限<select name="role"><option value="viewer">会員（自分の出欠を回答）</option><option value="editor">編集担当</option><option value="admin">管理者</option></select></label><label>初期・再設定用の暗証番号（数字4桁）<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="new-password"></label><label><input name="active" type="checkbox" checked> 利用を許可する</label><button class="primary">会員情報を保存</button><button type="button" id="new-member">新しい会員</button><p id="member-result" role="status"></p></form></section><section class="admin-panel"><h2>共通保存への移行</h2><p>この端末の予定・記録・出欠を共通保存へ追加します。共通保存済みの内容を優先し、端末内データも残します。</p><button id="migrate-local">この端末のデータを共通保存へ追加</button><p id="migrate-result" role="status"></p></section></div><section class="admin-panel"><h2>会員の暗証番号変更</h2><form id="pin-form"><label>新しい暗証番号<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="new-password"></label><button>暗証番号を変更</button><p role="status"></p></form></section></main><dialog id="data-dialog"><div class="dialog-body"><h2>データ管理</h2><p>JSON保存・読み込みは、公演一覧または稽古出欠の「データ管理」で行えます。</p><button id="data-close">閉じる</button></div></dialog><script type="module" src="admin.js?v=20261119-share1"></script></body></html>
