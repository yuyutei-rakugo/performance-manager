<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稽古・公演記録｜結友亭</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f3ed;color:#202c46}main{max-width:1300px;margin:auto;padding:24px}a{color:#234a84}h1{font-size:26px}aside{padding:16px;background:#fff4d8;line-height:1.8}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button{padding:12px;font:inherit;border:1px solid #aab2bc;border-radius:6px;background:white}input{min-width:200px}.scroll{overflow:auto;background:white}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px;border:1px solid #d9dce2;min-width:100px;text-align:left;vertical-align:top}th{background:#202c46;color:white;position:sticky;top:0}td:last-child{min-width:220px}.uncertain{background:#fff4d8}small{line-height:1.8}.table-controls{margin:12px 0}.table-controls p{line-height:1.6}.table-buttons{display:flex;justify-content:space-between;gap:12px}@media print{nav,.back,.table-controls,.account-panel,.edit-record{display:none}main{padding:0}body{background:white}.scroll{overflow:visible}table{font-size:8px}td,th{min-width:0;padding:5px}td:last-child{min-width:0}th{position:static}@page{size:A4 landscape;margin:10mm}}.account-panel{padding:16px;background:white;margin:16px 0}.record-dialog{width:min(600px,90vw);max-height:90vh;border-radius:8px;border:1px solid #ccd2dc}.record-dialog label{display:block;margin:12px 0}.record-dialog input,.record-dialog textarea,.record-dialog select{display:block;width:100%;box-sizing:border-box}.record-dialog button{margin:5px}button:disabled{opacity:.5}</style><main><a class="back" href="./">← 公演管理に戻る</a><h1>稽古・公演記録</h1><nav><select id="person"><option value="">全演者</option></select><select id="kind"><option value="">全区分</option></select><input id="query" placeholder="演目・会場・日付を検索"><button id="download">一覧をCSV保存</button><label>印刷の並び順 <select id="print-order"><option value="date">日付順</option><option value="kind">区分順（区分内は日付順）</option></select></label><button id="print-button">印刷・PDF保存</button></nav><p id="count"></p><div class="table-controls"><div class="table-buttons"><button type="button" id="table-left">← 左へ</button> <button type="button" id="table-right">右の演者へ →</button></div></div><div class="scroll" tabindex="0" aria-label="演者一覧。左右にスクロールできます"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><p><small>西暦は原本の令和表記から換算。</small></p></main><script type="module">
import {cloud,startCloud,mountAccount} from "./cloud.js";
import {historyEditor} from "./history-editor.js";
let editor;
const $=id=>document.getElementById(id);let data,shown,cols;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(order="date"){const person=$('person').value,q=$('query').value.trim();shown=data.records.filter(r=>(!$('kind').value||r.kind===$('kind').value)&&(!person||r.pieces[person])&&(!q||JSON.stringify(r).includes(q)));shown.sort((a,b)=>order==='kind'?(kindOrder.indexOf(a.kind)-kindOrder.indexOf(b.kind)||a.date.localeCompare(b.date)):a.date.localeCompare(b.date));cols=['日付','公演・稽古',...(person?[person]:data.names),'注記'];const names=person?[person]:data.names;$('head').innerHTML='<tr><th rowspan="2">日付</th><th rowspan="2">公演・稽古</th><th colspan="'+names.length+'">ネタ</th><th rowspan="2">注記</th></tr><tr>'+names.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr>';$('body').innerHTML=shown.map(r=>'<tr>'+values(r).map((v,i)=>'<td class="'+(/要確認|原文/.test(v)?'uncertain':'')+'">'+esc(v)+(i===1?'<br><button type="button" class="edit-record" data-record-edit="'+esc(r.id)+'" '+(editor?.allowed()?'':'hidden')+'>修正</button>':'')+'</td>').join('')+'</tr>').join('');$('count').textContent=shown.length+'行を表示';editor?.controls();}
function values(r){return [r.date,r.occasion,...($('person').value?[r.pieces[$('person').value]]:data.names.map(n=>r.pieces[n])),r.note]}
$('table-left').onclick=()=>document.querySelector('.scroll').scrollBy({left:-300,behavior:'smooth'});$('table-right').onclick=()=>document.querySelector('.scroll').scrollBy({left:300,behavior:'smooth'});
const kindOrder=['師匠稽古','定期落語会','飯沼観音寄席','図書館寄席','その他公演'];
$('print-button').onclick=()=>{if(data)window.print()};window.addEventListener('beforeprint',()=>{if(data)render($('print-order').value)});window.addEventListener('afterprint',()=>{if(data)render()});
fetch('history-data.json?revision=members1').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;for(const n of d.names)$('person').add(new Option(n,n));for(const n of new Set(d.records.map(r=>r.kind)))$('kind').add(new Option(n,n));render();editor=historyEditor(()=>data,()=>render());mountAccount();startCloud()}).catch(()=>$('count').textContent='記録を読み込めませんでした。再読み込みしてください。');for(const id of ['person','kind','query'])$(id).oninput=()=>data&&render();$('download').onclick=()=>{if(!data)return;const rows=[cols,...shown.map(values)];const text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='yuyutei-records-draft.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
