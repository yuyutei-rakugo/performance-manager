<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稽古・公演記録｜結友亭</title><link rel="stylesheet" href="style.css?v=20261121-duration1"><link rel="stylesheet" href="schedule-ui.css?v=20261121-duration1"><link rel="stylesheet" href="records.css?v=20261121-duration1"><link rel="stylesheet" href="rakugo-theme.css?v=20261121-duration1"><link rel="manifest" href="manifest.webmanifest?v=20261121-duration1"><link rel="icon" type="image/png" href="notebook-pixel-any-192-v3.png"><link rel="apple-touch-icon" href="notebook-pixel-maskable-512-v3.png"><meta name="theme-color" content="#071d42"><meta name="apple-mobile-web-app-capable" content="yes"><script src="install.js?v=20261121-duration1" defer></script></head><body class="history-page member-view"><header class="top"><div class="wrap top-inner"><div class="header-actions"><button id="data-open" class="data-button">データ管理</button></div></div></header><main class="wrap"><section class="hero"><img class="hero-logo" src="notebook-art-v2.png" alt="" width="96" height="109"><div><p class="hero-kicker">笑いで友をむすび、落語で地域を結ぶ</p><h1>結友亭の帳面</h1><p>公演の支度も、日々の稽古も。</p></div></section><nav class="tabs" aria-label="画面の切り替え"><a href="./?v=20261121-duration1">公演一覧</a><a href="rehearsals.html?v=20261121-duration1">稽古出欠</a><a href="history.html?v=20261121-duration1" aria-current="page">稽古・公演記録</a></nav><section class="workspace"><div class="section-head"><div><p class="eyebrow">RECORDS</p><h2>稽古・公演記録</h2></div></div><div id="history-tools"></div><nav class="record-filters" aria-label="記録の絞り込みと印刷"><select id="person"><option value="">全演者</option></select><select id="kind"><option value="">全区分</option></select><input id="query" placeholder="演目・会場・日付を検索"><label>表示順<select id="display-order"><option value="date">日付順</option><option value="kind">区分順</option></select></label><button id="download">一覧をCSV保存</button><label>印刷の並び順 <select id="print-order"><option value="date">日付順</option><option value="kind">区分順（区分内は日付順）</option></select></label><button id="print-button">印刷・PDF保存</button></nav><p id="count"></p><div class="table-controls"><div class="table-buttons"><button type="button" id="table-left">← 左へ</button> <button type="button" id="table-right">右の演者へ →</button></div></div><div class="scroll" tabindex="0" aria-label="日付と公演・稽古を固定した演者一覧。ネタの欄を左右にスクロールできます"><table><colgroup id="record-columns"></colgroup><thead id="head"></thead><tbody id="body"></tbody></table></div><p><small>西暦は原本の令和表記から換算。</small></p></section></main><footer class="wrap">結友亭落語研究会 <span>公演管理</span></footer><dialog id="data-dialog"><div class="dialog-body"><div class="dialog-head"><h2>データ管理</h2><button type="button" id="data-close" aria-label="閉じる">×</button></div><p>記録の保存・印刷は、一覧の「CSV保存」「印刷・PDF保存」から利用できます。</p></div></dialog><script type="module">
import {readCategories,categoryOptions,mountCategories} from './categories.js?v=20261121-duration1';
import {readRecords,formatDuration} from './record-transfer.js?v=20261121-duration1';
import {cloud,startCloud,mountAccount} from "./cloud.js?v=20261121-duration1";
import {historyEditor} from "./history-editor.js?v=20261121-duration1";
document.getElementById('data-open').onclick=()=>document.getElementById('data-dialog').showModal();document.getElementById('data-close').onclick=()=>document.getElementById('data-dialog').close();
let editor;
const $=id=>document.getElementById(id);let data,shown,cols,originalNames;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updatePerformerColumns(){
 const names=[...new Set([...originalNames,...data.records.flatMap(record=>Object.keys(record.pieces))])];
 if(names.length===data.names.length&&names.every((name,index)=>name===data.names[index])&&$('person').options.length>1)return;
 const selected=$('person').value;
 $('person').replaceChildren(new Option('全演者',''),...names.map(name=>new Option(name,name)));
 $('person').value=names.includes(selected)?selected:'';
 data.names=names;
}
function durationText(text){
 if(text==='未入力')return text;
 const match=/^(\d+(?:\.\d+)?)分(?:([0-5]?\d)秒)?$/.exec(text);
 return match?formatDuration(Number(match[1])*60+Number(match[2]||0)):null;
}
function recordCell(value,notes){
 const parts=String(value??'').split(notes?'\n':'／');
 return parts.map(part=>{
  const suffix=/^(.*)（([^（）]+)）$/.exec(part);
  const program=notes?/^(\d+\. .*｜.*)｜([^｜]+)(｜終了予定 .*)$/.exec(part):null;
  const time=durationText((program||suffix)?.[2]||'');
  if(!time)return esc(part);
  return '<span class="record-performance"><span>'+esc((program||suffix)[1])+'</span><span class="duration-value">'+esc(time)+'</span></span>'+(program?esc(program[3].slice(1)):'');
 }).join(notes?'\n':'<wbr>／');
}
function render(order=$('display-order').value){updatePerformerColumns();const previous=$('kind').value;$('kind').innerHTML='<option value="">全区分</option>'+categoryOptions(previous,data.records.map(r=>r.kind));$('kind').value=previous;const kindOrder=readCategories(data.records.map(r=>r.kind));const person=$('person').value,q=$('query').value.trim();shown=data.records.filter(r=>(!$('kind').value||r.kind===$('kind').value)&&(!person||r.pieces[person])&&(!q||JSON.stringify(r).includes(q)));shown.sort((a,b)=>order==='kind'?(kindOrder.indexOf(a.kind)-kindOrder.indexOf(b.kind)||a.date.localeCompare(b.date)):a.date.localeCompare(b.date));cols=['日付','公演・稽古',...(person?[person]:data.names),'注記'];const names=person?[person]:data.names;$('record-columns').innerHTML='<col style="width:var(--date-width)"><col style="width:var(--occasion-width)"><col span="'+names.length+'" style="width:8rem"><col style="width:14rem">';document.querySelector('.scroll table').style.width='calc(var(--date-width) + var(--occasion-width) + '+(names.length*8+14)+'rem)';$('head').innerHTML='<tr><th rowspan="2" class="fixed-date" scope="col">日付</th><th rowspan="2" class="fixed-occasion" scope="col">公演・稽古</th><th colspan="'+names.length+'">ネタ</th><th rowspan="2">注記</th></tr><tr>'+names.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr>';$('body').innerHTML=shown.map(r=>'<tr>'+values(r).map((v,i)=>'<td class="'+(i===0?'fixed-date ':i===1?'fixed-occasion ':'')+(/要確認|原文/.test(v)?'uncertain':'')+'">'+(i>1?recordCell(v,i===cols.length-1):esc(v))+(i===1?'<br><button type="button" class="edit-record" data-record-edit="'+esc(r.id)+'" '+(editor?.allowed()?'':'hidden')+'>修正</button>':'')+'</td>').join('')+'</tr>').join('');$('count').textContent=shown.length+'行を表示';editor?.controls();}
function values(r){return [r.date,r.occasion,...($('person').value?[r.pieces[$('person').value]]:data.names.map(n=>r.pieces[n])),r.note]}
$('table-left').onclick=()=>document.querySelector('.scroll').scrollBy({left:-300,behavior:'smooth'});$('table-right').onclick=()=>document.querySelector('.scroll').scrollBy({left:300,behavior:'smooth'});
const kindOrder=['師匠稽古','定期落語会','飯沼観音寄席','図書館寄席','その他公演','通常稽古','自主稽古','その他'];
$('print-button').onclick=()=>{if(data)window.print()};window.addEventListener('beforeprint',()=>{if(data)render($('print-order').value)});window.addEventListener('afterprint',()=>{if(data)render()});
mountAccount();startCloud();
fetch('history-data.json?revision=20261119-edit2').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{d.publicIds=d.records.map(r=>r.id);const map=new Map(d.records.map(r=>[r.id,r]));try{readRecords().forEach(r=>map.set(r.id,r))}catch{/* Local corruption cannot block public or shared records. */}d.records=[...map.values()];originalNames=d.names;data=d;mountCategories($('history-tools'),()=>data.records.map(r=>r.kind));window.addEventListener('categories-changed',()=>render());render();editor=historyEditor(()=>data,()=>render());}).catch(()=>$('count').textContent='記録を読み込めませんでした。再読み込みしてください。');for(const id of ['person','kind','query','display-order'])$(id).oninput=()=>data&&render();$('download').onclick=()=>{if(!data)return;const rows=[cols,...shown.map(values)];const text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='yuyutei-records-draft.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
