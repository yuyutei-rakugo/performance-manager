<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稽古・公演記録｜結友亭</title><link rel="stylesheet" href="style.css?v=20261124-layout2"><link rel="stylesheet" href="schedule-ui.css?v=20261124-layout2"><link rel="stylesheet" href="records.css?v=20261124-layout2"><link rel="stylesheet" href="rakugo-theme.css?v=20261124-layout2"><link rel="manifest" href="manifest.webmanifest?v=20261124-layout2"><link rel="icon" type="image/png" href="notebook-pixel-any-192-v3.png"><link rel="apple-touch-icon" href="notebook-pixel-maskable-512-v3.png"><meta name="theme-color" content="#071d42"><meta name="apple-mobile-web-app-capable" content="yes"><script src="install.js?v=20261124-layout2" defer></script></head><body class="history-page member-view"><header class="top"><div class="wrap top-inner"><div class="header-actions"><button id="data-open" class="data-button">データ管理</button></div></div></header><main class="wrap"><section class="hero"><img class="hero-logo" src="notebook-art-v2.png" alt="" width="96" height="109"><div><p class="hero-kicker">笑いで友をむすび、落語で地域を結ぶ</p><h1>結友亭の帳面</h1><p>公演の支度も、日々の稽古も。</p></div></section><nav class="tabs" aria-label="画面の切り替え"><a href="./?v=20261124-layout2">公演一覧</a><a href="rehearsals.html?v=20261124-layout2">稽古出欠</a><a href="history.html?v=20261124-layout2" aria-current="page">稽古・公演記録</a></nav><section class="workspace"><div class="section-head"><div><p class="eyebrow">RECORDS</p><h2>稽古・公演記録</h2></div></div><div id="history-tools"></div><div class="record-types" role="group" aria-label="記録の種類"><button type="button" data-record-type="event" aria-pressed="true">公演</button><button type="button" data-record-type="rehearsal" aria-pressed="false">稽古</button><button type="button" data-record-type="all" aria-pressed="false">すべて</button></div><nav class="record-filters" aria-label="記録の絞り込みと印刷"><select id="person"><option value="">全演者</option></select><select id="kind"><option value="">全区分</option></select><input id="query" placeholder="演目・会場・日付を検索"><label>表示順<select id="display-order"><option value="date">日付順</option><option value="kind">区分順</option></select></label><button id="download">一覧をCSV保存</button><label>印刷の並び順 <select id="print-order"><option value="date">日付順</option><option value="kind">区分順（区分内は日付順）</option></select></label><button id="print-button">印刷・PDF保存</button></nav><p id="count"></p><div class="table-controls"><div class="table-buttons"><button type="button" id="table-left">← 左へ</button> <button type="button" id="table-right">右の演者へ →</button></div></div><div class="scroll" tabindex="0" aria-label="日付と公演・稽古を固定した演者一覧。ネタの欄を左右にスクロールできます"><table><colgroup id="record-columns"></colgroup><thead id="head"></thead><tbody id="body"></tbody></table></div><p><small>西暦は原本の令和表記から換算。</small></p></section></main><footer class="wrap">結友亭落語研究会 <span>公演管理</span></footer><dialog id="data-dialog"><div class="dialog-body"><div class="dialog-head"><h2>データ管理</h2><button type="button" id="data-close" aria-label="閉じる">×</button></div><p>記録の保存・印刷は、一覧の「CSV保存」「印刷・PDF保存」から利用できます。</p></div></dialog><script type="module">
import {readCategories,mountCategories} from './categories.js?v=20261124-layout2';
import {readRecords,formatDuration} from './record-transfer.js?v=20261124-layout2';
import {cloud,startCloud,mountAccount} from "./cloud.js?v=20261124-layout2";
import {historyEditor} from "./history-editor.js?v=20261124-layout2";
document.getElementById('data-open').onclick=()=>document.getElementById('data-dialog').showModal();document.getElementById('data-close').onclick=()=>document.getElementById('data-dialog').close();
let editor;
const $=id=>document.getElementById(id);let data,shown,cols,originalNames;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function updatePerformerColumns(){
 const names=[...new Set([...originalNames,...data.records.flatMap(record=>[...Object.keys(record.pieces),...Object.keys(record.attendance||{})])])];
 if(names.length===data.names.length&&names.every((name,index)=>name===data.names[index])&&$('person').options.length>1)return;
 const selected=$('person').value;
 $('person').replaceChildren(new Option('全演者',''),...names.map(name=>new Option(name,name)));
 $('person').value=names.includes(selected)?selected:'';
 data.names=names;
}
const rehearsalKinds=new Set(['通常稽古','師匠稽古','自主稽古','その他稽古','稽古']);
let recordType='event';
function typeOf(record){
 if(['event','rehearsal'].includes(record.sourceType))return record.sourceType;
 const transferred=/^transferred:(event|rehearsal):/.exec(record.id);
 if(transferred)return transferred[1];
 if(Array.isArray(record.sourceData?.practices))return 'rehearsal';
 if(Array.isArray(record.sourceData?.performers))return 'event';
 return rehearsalKinds.has(record.kind)?'rehearsal':'event';
}
function durationText(text){
 if(text==='未入力')return text;
 const match=/^(\d+(?:\.\d+)?)分(?:([0-5]?\d)秒)?$/.exec(text);
 return match?formatDuration(Number(match[1])*60+Number(match[2]||0)):null;
}
function recordParts(value,notes){
 return String(value??'').split(notes?'\n':'／').map(part=>{
  const suffix=/^(.*)（([^（）]+)）$/.exec(part);
  const program=notes?/^(\d+\. .*｜.*)｜([^｜]+)(｜終了予定 .*)$/.exec(part):null;
  const time=durationText((program||suffix)?.[2]||'');
  return time?{text:(program||suffix)[1],time,end:program?.[3]}:{text:part};
 });
}
function recordCell(parts,notes){
 return parts.map(({text,time,end})=>time
  ?'<span class="record-performance"><span>'+esc(text)+'</span><span class="duration-value">'+esc(time)+'</span></span>'+(end?esc(end.slice(1)):'')
  :esc(text)).join(notes?'\n':'<wbr>／');
}
function rehearsalNote(record){
 const visiblePieces=new Map(Object.entries(record.pieces).map(([name,value])=>[name,value.split('／').map(part=>{
  const match=/^(.*)（([^（）]+)）$/.exec(part);
  const time=match&&durationText(match[2]);
  return time?[match[1],time]:[part,'未入力'];
 })]));
 const source=record.sourceData;
 const manualLines=new Set(String(source?.memo||source?.notes||'').split('\n'));
 const attendance=record.attendance||{};
 return record.note.split('\n').flatMap(line=>{
  if(manualLines.delete(line))return [line];
  const answer=/^([^：:]+)[：:]\s*(出席|欠席|未定|未回答|未登録)$/.exec(line);
  if(answer){
   const [,name,status]=answer;
   if(attendance[name]===status||(status==='出席'&&record.pieces[name]==='○')||
      (status==='未登録'&&attendance[name]==='未回答'))return [];
  }
  const entry=/^\d+\. ([^｜]+)｜(.+)$/.exec(line);
  if(!entry)return [line];
  const [,name,description]=entry;
  const suffix=/^(.*)（([^（）]+)）$/.exec(description);
  const time=suffix&&durationText(suffix[2]);
  const piece=time?suffix[1]:description;
  const member=name.replace(/^結友亭[ 　]*/,'').trim();
  const pieces=visiblePieces.get(name)||visiblePieces.get(member)||[];
  return pieces.some(([title,elapsed])=>title===piece&&elapsed===(time||'未入力'))?[]:[name+'｜'+description];
 }).join('\n');
}
function sorted(records,order){
 const kinds=readCategories(data.records.map(record=>record.kind));
 return [...records].sort((a,b)=>(order==='kind'?kinds.indexOf(a.kind)-kinds.indexOf(b.kind):0)||a.date.localeCompare(b.date));
}
function render(order=$('display-order').value){
 updatePerformerColumns();
 const previous=$('kind').value;
 const available=data.records.filter(record=>recordType==='all'||typeOf(record)===recordType);
 const categories=new Set(available.map(record=>record.kind));
 $('kind').replaceChildren(new Option('全区分',''),...readCategories([...categories]).filter(kind=>categories.has(kind)).map(kind=>new Option(kind,kind)));
 $('kind').value=available.some(record=>record.kind===previous)?previous:'';
 const person=$('person').value,query=$('query').value.trim(),kind=$('kind').value;
 shown=sorted(available.filter(record=>(!kind||record.kind===kind)&&(!person||record.pieces[person]||Object.hasOwn(record.attendance||{},person))&&(!query||JSON.stringify(record).includes(query))),order);
 const names=person?[person]:data.names;
 cols=['日付','公演・稽古',...names,'注記'];
 $('record-columns').innerHTML='<col style="width:var(--date-width)"><col style="width:var(--occasion-width)"><col span="'+names.length+'" style="width:8rem"><col style="width:14rem">';
 document.querySelector('.scroll table').style.width='calc(var(--date-width) + var(--occasion-width) + '+(names.length*8+14)+'rem)';
 $('head').innerHTML='<tr><th rowspan="2" class="fixed-date" scope="col">日付</th><th rowspan="2" class="fixed-occasion" scope="col">公演・稽古</th><th colspan="'+names.length+'">ネタ</th><th rowspan="2">注記</th></tr><tr>'+names.map(name=>'<th scope="col">'+esc(name)+'</th>').join('')+'</tr>';
 renderRows();
 $('count').textContent=shown.length+'件を表示';
}
function recordValues(record){
 const rehearsal=typeOf(record)==='rehearsal';
 const members=cols.slice(2,-1).map(name=>{
  const piece=record.pieces[name];
  const attendance=rehearsal&&Object.hasOwn(record.attendance||{},name)?record.attendance[name]:undefined;
  if(attendance===undefined||piece?.trim()&&piece.trim()!=='○')return {value:piece};
  return {value:attendance==='出席'?'○':''};
 });
 return [{value:record.date},{value:record.occasion},...members,{value:rehearsal?rehearsalNote(record):record.note,notes:true}];
}
function renderRows(){
 $('body').innerHTML=shown.map(record=>'<tr data-record-id="'+esc(record.id)+'">'+recordValues(record).map(({value,notes},index)=>{
  const column=index===0?'fixed-date':index===1?'fixed-occasion':'';
  const edit=index===1&&editor?.canSelect(record.id)?'<br><button type="button" class="edit-record" data-record-edit="'+esc(record.id)+'">編集する</button>':'';
  return '<td class="'+column+(/要確認|原文/.test(value)?' uncertain':'')+'">'+(index<2?esc(value):recordCell(recordParts(value,notes),notes))+edit+'</td>';
 }).join('')+'</tr>').join('')||'<tr><td colspan="'+cols.length+'">該当する記録はありません。</td></tr>';
}
function csvValues(record){
 return recordValues(record).map(({value,notes},index)=>{
  if(index<2)return value;
  return recordParts(value,notes).map(({text,time,end})=>{
   if(!time)return text;
   return end?text+'｜'+time+end:text+'（'+time+'）';
  }).join(notes?'\n':'／');
 });
}
$('body').onclick=event=>{
 const id=event.target.closest('[data-record-edit]')?.dataset.recordEdit;
 if(id)editor.select(id);
};
$('table-left').onclick=()=>document.querySelector('.scroll').scrollBy({left:-300,behavior:'smooth'});
$('table-right').onclick=()=>document.querySelector('.scroll').scrollBy({left:300,behavior:'smooth'});
document.querySelector('.record-types').onclick=event=>{
 const button=event.target.closest('[data-record-type]');
 if(!button)return;
 recordType=button.dataset.recordType;
 for(const option of button.parentElement.querySelectorAll('button'))option.setAttribute('aria-pressed',String(option===button));
 if(data)render();
};
$('print-button').onclick=()=>{if(data)window.print()};
window.addEventListener('beforeprint',()=>{if(data)render($('print-order').value)});
window.addEventListener('afterprint',()=>{if(data)render()});
mountAccount();startCloud();
fetch('history-data.json?revision=20261119-edit2').then(response=>{
 if(!response.ok)throw Error();
 return response.json();
}).then(records=>{
 records.publicIds=records.records.map(record=>record.id);
 const merged=new Map(records.records.map(record=>[record.id,record]));
 try{readRecords().forEach(record=>merged.set(record.id,record))}catch{/* Shared records remain available. */}
 records.records=[...merged.values()];originalNames=records.names;data=records;
 mountCategories($('history-tools'),()=>data.records.map(record=>record.kind));
 window.addEventListener('categories-changed',()=>render());
 render();
 editor=historyEditor(()=>data,render,renderRows);
 renderRows();
}).catch(()=>$('count').textContent='記録を読み込めませんでした。再読み込みしてください。');
for(const id of ['person','kind','query','display-order'])$(id).oninput=()=>data&&render();
$('download').onclick=()=>{
 if(!data)return;
 const rows=[cols,...shown.map(csvValues)];
 const text='\ufeff'+rows.map(row=>row.map(value=>'"'+String(value??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const link=document.createElement('a');
 link.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
 link.download='yuyutei-records-draft.csv';link.click();
 setTimeout(()=>URL.revokeObjectURL(link.href),1000);
};
</script></body></html>
