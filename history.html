<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稽古・公演記録｜結友亭</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f3ed;color:#202c46}main{max-width:1300px;margin:auto;padding:24px}a{color:#234a84}h1{font-size:26px}aside{padding:16px;background:#fff4d8;line-height:1.8}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button{padding:12px;font:inherit;border:1px solid #aab2bc;border-radius:6px;background:white}input{min-width:200px}.scroll{overflow:auto;background:white}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:12px;border:1px solid #d9dce2;min-width:100px;text-align:left;vertical-align:top}th{background:#202c46;color:white;position:sticky;top:0}td:last-child{min-width:220px}.uncertain{background:#fff4d8}small{line-height:1.8}.table-controls{margin:12px 0}.table-controls p{line-height:1.6}@media print{nav,.back,.table-controls{display:none}main{padding:0}body{background:white}.scroll{overflow:visible}table{font-size:8px}td,th{min-width:0;padding:5px}td:last-child{min-width:0}th{position:static}@page{size:A4 landscape;margin:10mm}}</style><main><a class="back" href="./">← 公演管理に戻る</a><h1>稽古・公演記録（清書案）</h1><aside>手書き修正写真2枚を反映した清書案です。○・△・空欄は原本の記号を残しています。「要確認」の箇所は判読が不確かなため未確定です。未来の日付は実施済みを意味しません。<br>この一覧は公開URLから誰でも閲覧できます。閲覧用の共通記録で、端末間の編集同期機能はありません。</aside><nav><select id="person"><option value="">全演者</option></select><select id="kind"><option value="">全区分</option></select><input id="query" placeholder="演目・会場・日付を検索"><button id="download">一覧をCSV保存</button><label>印刷の並び順 <select id="print-order"><option value="date">日付順</option><option value="kind">区分順（区分内は日付順）</option></select></label><button id="print-button">印刷・PDF保存</button></nav><p id="count"></p><div class="table-controls"><p>全演者の表は右に続きます。表を左右にスワイプするか、ボタンで移動してください。</p><button type="button" id="table-left">← 左へ</button> <button type="button" id="table-right">右の演者へ →</button></div><div class="scroll" tabindex="0" aria-label="演者一覧。左右にスクロールできます"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><p><small>西暦は原本の令和表記から換算。曜日は転記せず、原本の日付を優先しています。師匠名・一部のゲスト欄などの細字は未確定です。原本写真は公開していません。</small></p></main><script>
const $=id=>document.getElementById(id);let data,shown,cols;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(order="date"){const person=$('person').value,q=$('query').value.trim();shown=data.records.filter(r=>(!$('kind').value||r.kind===$('kind').value)&&(!person||r.pieces[person])&&(!q||JSON.stringify(r).includes(q)));shown.sort((a,b)=>order==='kind'?(kindOrder.indexOf(a.kind)-kindOrder.indexOf(b.kind)||a.date.localeCompare(b.date)):a.date.localeCompare(b.date));cols=['日付','公演・稽古',...(person?[person]:data.names),'注記'];const names=person?[person]:data.names;$('head').innerHTML='<tr><th rowspan="2">日付</th><th rowspan="2">公演・稽古</th><th colspan="'+names.length+'">ネタ</th><th rowspan="2">注記</th></tr><tr>'+names.map(n=>'<th>'+esc(n)+'</th>').join('')+'</tr>';$('body').innerHTML=shown.map(r=>'<tr>'+values(r).map(v=>'<td class="'+(/要確認|原文/.test(v)?'uncertain':'')+'">'+esc(v)+'</td>').join('')+'</tr>').join('');$('count').textContent=shown.length+'行を表示（元記録49行）';}
function values(r){return [r.date,r.occasion,...($('person').value?[r.pieces[$('person').value]]:data.names.map(n=>r.pieces[n])),r.note]}
$('table-left').onclick=()=>document.querySelector('.scroll').scrollBy({left:-300,behavior:'smooth'});$('table-right').onclick=()=>document.querySelector('.scroll').scrollBy({left:300,behavior:'smooth'});
const kindOrder=['師匠稽古','定期落語会','飯沼観音寄席','図書館寄席','その他公演'];
$('print-button').onclick=()=>{if(data)window.print()};window.addEventListener('beforeprint',()=>{if(data)render($('print-order').value)});window.addEventListener('afterprint',()=>{if(data)render()});
fetch('history-data.json?revision=8b84bf7').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;for(const n of d.names)$('person').add(new Option(n,n));for(const n of new Set(d.records.map(r=>r.kind)))$('kind').add(new Option(n,n));render()}).catch(()=>$('count').textContent='記録を読み込めませんでした。再読み込みしてください。');for(const id of ['person','kind','query'])$(id).oninput=()=>data&&render();$('download').onclick=()=>{if(!data)return;const rows=[cols,...shown.map(values)];const text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='yuyutei-records-draft.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
